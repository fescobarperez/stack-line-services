#
# Se activa a propósito, no por defecto:
#   MICRONAUT_ENVIRONMENTS=cloud ./gradlew run
#   o en IntelliJ: Run → Edit Configurations → Environment variables
#
# La contraseña NO está aquí. Este archivo va al repositorio, que es público.
# Se pasa por entorno:
#   DB_PASSWORD=... MICRONAUT_ENVIRONMENTS=cloud ./gradlew run
#
# Ojo: esta es la MISMA base que usa el servidor desplegado. Lo que borres o
# migres desde tu máquina lo verás en http://3.142.8.206 — y al revés.

datasources.default.url=${DB_URL:`jdbc:postgresql://stackline-dev.cdeegm0iyhvf.us-east-2.rds.amazonaws.com:5432/erp_maya`}
datasources.default.username=${DB_USER:erp_maya}

# El seed no debe correr contra la base compartida: la empresa ya existe y
# crearía una segunda si alguien cambia el código.
erp.seed.enabled=false
