#Wed Jun 17 05:49:19 UTC 2026
micronaut.application.name=erp_maya

# ── Datasource PostgreSQL ─────────────────────────────────────────────
# La URL la arma cada perfil con DB_HOST, DB_PORT y DB_NAME, y fija su propio
# esquema: application-dev.properties → stackline_dev,
# application-prod.properties → stackline_prod. Misma base y mismas
# credenciales; lo que separa los ambientes es el esquema.
#
# La CONTRASEÑA no está aquí y no debe estarlo: el repositorio es público.
# Llega por la variable DB_PASSWORD — del .env de la raíz al correr en local,
# del .env del servidor al desplegar.
datasources.default.username=${DB_USER:erp_maya}
# Sin valor por defecto a propósito: es preferible que falle diciendo que
# falta DB_PASSWORD a que intente conectarse con una contraseña inventada y
# el error hable de credenciales inválidas.
datasources.default.password=${DB_PASSWORD}
datasources.default.driver-class-name=org.postgresql.Driver
datasources.default.db-type=postgres
datasources.default.dialect=POSTGRES
datasources.default.schema-generate=NONE

# ── Liquibase (migraciones) ───────────────────────────────────────────
liquibase.datasources.default.change-log=classpath:db/changelog/db.changelog-master.xml

# ── JPA / Hibernate (el schema lo administra Liquibase → hbm2ddl none) ─
jpa.default.entity-scan.packages=com.erp_maya
jpa.default.properties.hibernate.hbm2ddl.auto=none
jpa.default.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Mapeo de columnas JSON/JSONB (Role.permissions) vía Jackson
jpa.default.properties.hibernate.type.json_format_mapper=jackson

# ── CORS (el front Vite corre en :5173) ───────────────────────────────
micronaut.server.cors.enabled=true
micronaut.server.cors.configurations.web.allowed-origins=http://localhost:5173

# ── Seguridad JWT (Bearer) ────────────────────────────────────────────
# Secreto de firma HS256: mínimo 256 bits. En prod se inyecta por env JWT_SECRET.
micronaut.security.authentication=bearer
micronaut.security.token.jwt.signatures.secret.generator.secret=${JWT_SECRET:cambia-este-secreto-de-desarrollo-por-uno-de-al-menos-256-bits!!}
micronaut.security.token.jwt.signatures.secret.generator.jws-algorithm=HS256
# Vigencia del token en segundos (8h)
erp.security.token-expiration=28800
# Reglas de acceso: el login es anónimo; todo lo demás requiere token válido.
micronaut.security.intercept-url-map[0].pattern=/api/auth/login
micronaut.security.intercept-url-map[0].http-method=POST
micronaut.security.intercept-url-map[0].access=isAnonymous()
# Login de la consola de plataforma (operadores de Stackline, no usuarios de empresa).
micronaut.security.intercept-url-map[1].pattern=/api/platform/auth/login
micronaut.security.intercept-url-map[1].http-method=POST
micronaut.security.intercept-url-map[1].access=isAnonymous()
# Servicio a servicio (agents-services): sin JWT, la llave X-Api-Key se valida en el controlador.
micronaut.security.intercept-url-map[2].pattern=/api/internal/**
micronaut.security.intercept-url-map[2].http-method=POST
micronaut.security.intercept-url-map[2].access=isAnonymous()
# Activación de cuenta con el enlace de invitación (la app, sin sesión).
micronaut.security.intercept-url-map[3].pattern=/api/auth/activation
micronaut.security.intercept-url-map[3].access=isAnonymous()
micronaut.security.intercept-url-map[4].pattern=/api/**
micronaut.security.intercept-url-map[4].access=isAuthenticated()

# ── Consola de plataforma ─────────────────────────────────────────────
# Token de los operadores (kind=platform): solo abre /api/platform/**.
erp.platform.token-expiration=28800
# Primer dueño: se crea al arrancar si no hay ningún operador. Sin valores por
# defecto fuera de dev: la contraseña va por entorno y con 12 caracteres o más.
erp.platform.owner.email=${PLATFORM_OWNER_EMAIL:}
erp.platform.owner.name=${PLATFORM_OWNER_NAME:Dueño}
erp.platform.owner.password=${PLATFORM_OWNER_PASSWORD:}
# Pantalla de la app donde el admin invitado define su contraseña (la URL
# del enlace que muestra la consola). En el servidor: https://<app>/activar
erp.platform.activation-url=${PLATFORM_ACTIVATION_URL:http://localhost:5173/activar}

# ── Seed de desarrollo (empresa + admin de prueba al arrancar) ────────
erp.seed.enabled=true

# ── Subida de archivos a S3 (logos de empresa) ────────────────────────
# El navegador sube directo a S3 con una URL prefirmada que emite el backend.
# Las credenciales NO van aquí: en prod las provee el IAM Role de la instancia
# (cadena de credenciales por defecto del SDK); en local, tu perfil AWS.
erp.s3.bucket=${S3_LOGO_BUCKET:stackline-client-logos-460005624841}
erp.s3.region=${AWS_REGION:us-east-1}
erp.s3.logo-prefix=${S3_LOGO_PREFIX:logos/}
# Vigencia de la URL prefirmada de subida, en segundos (5 min por defecto).
erp.s3.presign-expiry-seconds=${S3_PRESIGN_EXPIRY:300}

# ── Asistente comercial (agents-services) ─────────────────────────────
# El ERP reenvía POST /api/agent/turn a agents-services con esta api-key
# (la misma que agents-services espera en AGENT_KEY_ERP). Va por env, nunca aquí.
micronaut.http.services.agent.url=${AGENT_URL:`http://localhost:8081`}
micronaut.http.services.agent.read-timeout=45s
erp.agent.api-key=${AGENT_KEY_ERP:}
# Consola de plataforma → /v1/admin/ai de agents-services (modelos y agentes).
# Es la AGENT_KEY_PLATFORM que agents-services declara con scope admin. Por env.
erp.agent.admin-key=${AGENT_KEY_PLATFORM:}
# Uso y costos de la consola: los costos de IA vienen en USD y el margen se
# calcula en quetzales con este tipo de cambio.
erp.platform.fx.usd-to-gtq=${PLATFORM_FX_USD_GTQ:7.75}

# ── Ciclo de vida de cotizaciones del asistente ───────────────────────
# Una cotización 'abierta' (la arma el asistente) sin actividad en este
# tiempo pasa a 'abandonada'. Avisos al cliente (cambios aplicados por el
# vendedor): se entregan a agents-services con reintentos.
erp.quotes.abandon-after-hours=${QUOTES_ABANDON_HOURS:72}
erp.quotes.notifications.enabled=${QUOTE_NOTIFICATIONS_ENABLED:true}
