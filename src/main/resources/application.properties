#Wed Jun 17 05:49:19 UTC 2026
micronaut.application.name=erp_maya

# ── Datasource PostgreSQL ─────────────────────────────────────────────
# Por defecto, el contenedor Docker `maya-postgres`: expone el 5432 interno en
# el 5433 del host (el 5432 local ya lo ocupa un Postgres nativo).
#
# Para trabajar contra la base de RDS en vez de la local, sin editar nada:
#   DB_PASSWORD=... MICRONAUT_ENVIRONMENTS=cloud ./gradlew run
# Ver application-cloud.properties.
#
# Override puntual por env DB_URL.
datasources.default.url=${DB_URL:`jdbc:postgresql://localhost:5433/erp_maya`}
datasources.default.username=${DB_USER:erp_maya}
datasources.default.password=${DB_PASSWORD:erp_maya}
datasources.default.driver-class-name=org.postgresql.Driver
datasources.default.db-type=postgres
datasources.default.dialect=POSTGRES
datasources.default.schema-generate=NONE

# ── Liquibase (migraciones) ───────────────────────────────────────────
liquibase.datasources.default.change-log=classpath:db/changelog/db.changelog-master.xml

# ── JPA / Hibernate (el schema lo administra Liquibase → hbm2ddl none) ─
jpa.default.entity-scan.packages=com.erp_maya
jpa.default.properties.hibernate.hbm2ddl.auto=none
jpa.default.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Mapeo de columnas JSON/JSONB (Role.permissions) vía Jackson
jpa.default.properties.hibernate.type.json_format_mapper=jackson

# ── CORS (el front Vite corre en :5173) ───────────────────────────────
micronaut.server.cors.enabled=true
micronaut.server.cors.configurations.web.allowed-origins=http://localhost:5173

# ── Seguridad JWT (Bearer) ────────────────────────────────────────────
# Secreto de firma HS256: mínimo 256 bits. En prod se inyecta por env JWT_SECRET.
micronaut.security.authentication=bearer
micronaut.security.token.jwt.signatures.secret.generator.secret=${JWT_SECRET:cambia-este-secreto-de-desarrollo-por-uno-de-al-menos-256-bits!!}
micronaut.security.token.jwt.signatures.secret.generator.jws-algorithm=HS256
# Vigencia del token en segundos (8h)
erp.security.token-expiration=28800
# Reglas de acceso: el login es anónimo; todo lo demás requiere token válido.
micronaut.security.intercept-url-map[0].pattern=/api/auth/login
micronaut.security.intercept-url-map[0].http-method=POST
micronaut.security.intercept-url-map[0].access=isAnonymous()
micronaut.security.intercept-url-map[1].pattern=/api/**
micronaut.security.intercept-url-map[1].access=isAuthenticated()

# ── Seed de desarrollo (empresa + admin de prueba al arrancar) ────────
erp.seed.enabled=true
