# Configuración local de desarrollo. NO va al repositorio (ver .gitignore).
#
# Micronaut activa el entorno `dev` al correr con ./gradlew run o desde el
# IDE, así que esto se carga solo — sin variables de entorno que recordar.
datasources.default.password=stackline1234!

# El seed no debe correr contra la base compartida con el servidor: la
# empresa ya existe y crearía una segunda.
erp.seed.enabled=false
