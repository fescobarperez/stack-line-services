# Ajustes del servidor desplegado.
#
# Se activa con MICRONAUT_ENVIRONMENTS=prod, que el compose pasa desde APP_ENV.
#
# Aquí NO van secretos: este archivo sí va al repositorio, que es público. La
# contraseña de la base y el secreto de firma llegan por variable de entorno
# desde el .env del servidor, que no se versiona.

# ── Pool de conexiones ────────────────────────────────────────────────
# Hikari por defecto abre hasta 10. Con RDS db.t4g.micro —que admite unas 80
# conexiones en total— y una sola instancia de aplicación, 10 es holgado y
# deja margen para que tú entres con IntelliJ sin competir por cupo.
# Un pool grande no acelera nada: la base es el cuello de botella, no el pool.
datasources.default.maximum-pool-size=10
datasources.default.minimum-idle=2
# Cortar conexiones ociosas evita que RDS las mate primero y el pool entregue
# una muerta al siguiente que la pida.
datasources.default.idle-timeout=300000
datasources.default.max-lifetime=900000

# ── Registro ──────────────────────────────────────────────────────────
# En desarrollo interesa el detalle; en el servidor llena el disco y esconde
# lo que importa. Los errores siguen saliendo completos.
logger.levels.io.micronaut.data.query=WARN
logger.levels.org.hibernate=WARN
logger.levels.com.zaxxer.hikari=WARN
logger.levels.liquibase=INFO
logger.levels.com.erp_maya=INFO

# ── Errores ───────────────────────────────────────────────────────────
# Que la traza no viaje al navegador: le dice a un atacante qué versiones y
# qué clases hay dentro. Queda en los logs, que es donde sirve.
micronaut.server.error.include-stacktrace=NEVER

# ── Instalación inicial ───────────────────────────────────────────────
# Apagado por defecto en el servidor: una instalación ya en marcha no debe
# intentar crear la empresa en cada arranque. El compose lo enciende con
# ERP_SEED_ENABLED cuando se está montando una nueva —las variables de
# entorno ganan sobre este archivo.
erp.seed.enabled=false
