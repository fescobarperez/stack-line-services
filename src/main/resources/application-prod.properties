# Ajustes de PRODUCCIÓN: base en RDS.
#
# Se activa con MICRONAUT_ENVIRONMENTS=prod (en el servidor, APP_ENV=prod en
# el .env del compose). Aquí NO van secretos: este archivo va al repositorio,
# que es público. DB_PASSWORD llega por variable de entorno.

# Esquema stackline_prod, en la misma base que dev. Se crea vacío a mano
# antes del primer arranque y Liquibase crea todo adentro:
#   CREATE SCHEMA IF NOT EXISTS stackline_prod;
#
# El endpoint no es secreto: sin la contraseña y sin estar en la lista de IPs
# del grupo de seguridad no sirve de nada.
datasources.default.url=jdbc:postgresql://${DB_HOST:stackline-dev.cdeegm0iyhvf.us-east-2.rds.amazonaws.com}:${DB_PORT:5432}/${DB_NAME:erp_maya}?currentSchema=stackline_prod
