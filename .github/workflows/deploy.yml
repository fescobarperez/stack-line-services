# Manual production deployment.
#
# The OpenAI key is streamed over the existing verified SSH connection. The
# deploy script updates deploy/.env atomically and removes the staged copy.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Service to rebuild"
        type: choice
        required: true
        default: backend
        options: [inspect, inspect-ai, inspect-discovery, inspect-apply, cancel-builds, configure, backend, crawling, agents, auto, all]

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: produccion
    timeout-minutes: 45

    steps:
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Inspect EC2
        if: inputs.target == 'inspect'
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o BatchMode=yes \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              'set -eu; echo "=== uptime ==="; uptime; echo "=== memory ==="; free -h; echo "=== swap ==="; swapon --show; echo "=== largest processes ==="; ps -eo pid,ppid,%cpu,%mem,rss,etime,args --sort=-rss | head -n 20; echo "=== disk ==="; df -h /; echo "=== containers ==="; cd "$HOME/stackline/stack-line-services/deploy"; docker compose ps; echo "=== Docker storage ==="; docker system df; echo "=== recent kernel events ==="; sudo journalctl -k --since "30 minutes ago" --no-pager | tail -n 150; echo "=== recent Docker events ==="; sudo journalctl -u docker --since "30 minutes ago" --no-pager | tail -n 100'

      - name: Inspect OpenAI authentication
        if: inputs.target == 'inspect-ai'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          expected_hash="$(printf '%s' "$OPENAI_API_KEY" | sha256sum | cut -d ' ' -f 1)"
          ssh -i ~/.ssh/deploy_key \
              -o BatchMode=yes \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              "git -C ~/stackline/stack-line-services fetch -q origin ${{ github.sha }} && cd ~/stackline/stack-line-services/deploy && git -C .. show ${{ github.sha }}:deploy/inspect-openai-auth.py | docker compose exec -T -e EXPECTED_OPENAI_KEY_HASH=$expected_hash crawling python -"

      - name: Inspect category discovery
        if: inputs.target == 'inspect-discovery'
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o BatchMode=yes \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              "git -C ~/stackline/stack-line-services fetch -q origin ${{ github.sha }} && cd ~/stackline/stack-line-services/deploy && git -C .. show ${{ github.sha }}:deploy/inspect-discovery.py | docker compose exec -T crawling python -"

      - name: Inspect catalog apply logs
        if: inputs.target == 'inspect-apply'
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o BatchMode=yes \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              'set -eu; cd "$HOME/stackline/stack-line-services/deploy"; echo "=== last backend logs ==="; docker compose logs --no-color --timestamps --since "24h" backend 2>&1 | tail -n 500; echo "=== backend container status ==="; docker compose ps backend'

      - name: Cancel stale image builds
        if: inputs.target == 'cancel-builds'
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o BatchMode=yes \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              'set -eu; pids="$(pgrep -f "^/opt/java/openjdk/bin/java .*org.gradle.launcher.daemon.bootstrap.GradleDaemon|^/opt/java/openjdk/bin/java .* /src/gradle/wrapper/gradle-wrapper.jar .*shadowJar" || true)"; if [ -z "$pids" ]; then echo "No stale Gradle builds found"; exit 0; fi; echo "Stopping stale Gradle build processes: $pids"; sudo kill -TERM $pids; sleep 10; remaining=""; for pid in $pids; do if sudo kill -0 "$pid" 2>/dev/null; then remaining="$remaining $pid"; fi; done; if [ -n "$remaining" ]; then echo "Force-stopping unresponsive build processes:$remaining"; sudo kill -KILL $remaining; fi; echo "Stale Gradle builds stopped"'

      - name: Stage OpenAI key
        if: inputs.target != 'inspect' && inputs.target != 'inspect-ai' && inputs.target != 'inspect-discovery' && inputs.target != 'inspect-apply' && inputs.target != 'cancel-builds'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not configured" >&2
            exit 1
          fi
          printf '%s\n' "$OPENAI_API_KEY" | ssh -i ~/.ssh/deploy_key \
              -o BatchMode=yes \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              'umask 077; dd of="$HOME/.stackline-openai-key" status=none'

      - name: Deploy
        if: inputs.target != 'inspect' && inputs.target != 'inspect-ai' && inputs.target != 'inspect-discovery' && inputs.target != 'inspect-apply' && inputs.target != 'cancel-builds'
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o BatchMode=yes \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              "git -C ~/stackline/stack-line-services fetch -q origin main && git -C ~/stackline/stack-line-services show origin/main:deploy/deploy.sh | OPENAI_KEY_FILE=\$HOME/.stackline-openai-key bash -s -- ${{ inputs.target }}"

      - name: Remove transient keys
        if: always()
        run: |
          if [ -f ~/.ssh/deploy_key ]; then
            ssh -i ~/.ssh/deploy_key \
                -o BatchMode=yes \
                -o ServerAliveInterval=30 \
                -o ServerAliveCountMax=10 \
                "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
                'rm -f -- "$HOME/.stackline-openai-key"' || true
          fi
          rm -f ~/.ssh/deploy_key
