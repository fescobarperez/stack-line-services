# Stackline production stack.
#
# The four repositories must be siblings:
#   ~/stackline/stack-line-services
#   ~/stackline/stack-line-ui
#   ~/stackline/agents-services
#   ~/stackline/sites-crawler
#
# Start: cd stack-line-services/deploy && docker compose up -d --build

name: stackline

services:
  # PostgreSQL stays behind an opt-in profile because deployed environments use RDS.
  db:
    profiles: ["local-db"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-erp_maya}
      POSTGRES_USER: ${DB_USER:-erp_maya}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-erp_maya} -d ${DB_NAME:-erp_maya}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      crawling:
        condition: service_healthy
    environment:
      MICRONAUT_ENVIRONMENTS: ${APP_ENV:-dev}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-erp_maya}
      DB_USER: ${DB_USER:-erp_maya}
      DB_PASSWORD: ${DB_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET in deploy/.env}
      ERP_SEED_ENABLED: "${SEED_ENABLED:-true}"
      ERP_SEED_COMPANY_CODE: ${SEED_COMPANY_CODE:?define SEED_COMPANY_CODE in deploy/.env}
      ERP_SEED_COMPANY_NAME: ${SEED_COMPANY_NAME:-Stackline}
      ERP_SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?define SEED_ADMIN_EMAIL in deploy/.env}
      ERP_SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?define SEED_ADMIN_PASSWORD in deploy/.env}
      AGENT_URL: http://agents:8081
      AGENT_KEY_ERP: ${AGENT_KEY_ERP:?define AGENT_KEY_ERP in deploy/.env}
      AGENT_KEY_PLATFORM: ${AGENT_KEY_PLATFORM:-}
      PLATFORM_OWNER_EMAIL: ${PLATFORM_OWNER_EMAIL:-}
      PLATFORM_OWNER_NAME: ${PLATFORM_OWNER_NAME:-}
      PLATFORM_OWNER_PASSWORD: ${PLATFORM_OWNER_PASSWORD:-}
      PLATFORM_ACTIVATION_URL: ${PLATFORM_ACTIVATION_URL:-}
      PLATFORM_FX_USD_GTQ: ${PLATFORM_FX_USD_GTQ:-7.75}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=70}
      CRAWLING_SERVICE_URL: ${CRAWLING_SERVICE_URL:-http://crawling:8090}
      CRAWLING_STORAGE_ROOT: /var/lib/stackline/crawling
      AI_MODE: ${AI_MODE:-real}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-gpt-6-luna}
    volumes:
      - crawlingdata:/var/lib/stackline/crawling

  crawling:
    build:
      context: ${CRAWLER_CONTEXT:-../../sites-crawler}
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      AI_MODE: ${AI_MODE:-real}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-gpt-6-luna}
      AI_CHAT_BASE_URL: ${AI_CHAT_BASE_URL:-https://api.openai.com/v1/chat/completions}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?define OPENAI_API_KEY in deploy/.env}
      CRAWL_STORAGE_ROOT: /var/lib/stackline/crawling
      CRAWLING_STORAGE_ROOT: /var/lib/stackline/crawling
    volumes:
      - crawlingdata:/var/lib/stackline/crawling
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=5).read()"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 10s

  # Tino sales assistant. It uses its own schema in the ERP database.
  agents:
    build:
      context: ${AGENTS_CONTEXT:-../../agents-services}
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on: [backend]
    mem_limit: ${AGENTS_MEM_LIMIT:-768m}
    environment:
      MICRONAUT_ENVIRONMENTS: ${APP_ENV:-dev}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-erp_maya}
      DB_USER: ${DB_USER:-erp_maya}
      DB_PASSWORD: ${DB_PASSWORD:?}
      ERP_BASE_URL: http://backend:8080
      AGENT_KEY_ERP: ${AGENT_KEY_ERP:?}
      AGENT_KEY_PLATFORM: ${AGENT_KEY_PLATFORM:-}
      AGENT_PUBLIC_URL: ${AGENT_PUBLIC_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_STICKERS_ENABLED: ${WHATSAPP_STICKERS_ENABLED:-true}
      JAVA_OPTS: ${AGENTS_JAVA_OPTS:--XX:MaxRAMPercentage=75}

  web:
    build:
      context: ${UI_CONTEXT:-../../stack-line-ui}
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on: [backend]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      API_UPSTREAM: backend:8080
      AGENT_UPSTREAM: agents:8081
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddydata:/data
      - caddyconfig:/config

volumes:
  pgdata:
  caddydata:
  caddyconfig:
  crawlingdata:
