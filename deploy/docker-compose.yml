# Stackline — pila de producción.
#
# Se asume que los tres repos están clonados como hermanos:
#   ~/stackline/stack-line-services   ← este
#   ~/stackline/stack-line-ui
#   ~/stackline/agents-services
#
# Arranque:  cd stack-line-services/deploy && docker compose up -d --build

name: stackline

services:
  # Postgres en contenedor. Con RDS configurado NO se levanta: queda tras un
  # perfil para poder volver a él si hace falta, sin borrar el volumen.
  #   docker compose --profile local-db up -d
  db:
    profiles: ["local-db"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-erp_maya}
      POSTGRES_USER: ${DB_USER:-erp_maya}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Atado a 127.0.0.1 a propósito: el puerto queda accesible DENTRO del
      # servidor —lo que necesita un túnel SSH— pero no escucha en la interfaz
      # pública, así que desde internet sigue sin existir. Poner "5432:5432"
      # a secas la abriría al mundo entero.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-erp_maya} -d ${DB_NAME:-erp_maya}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      # En deploy/ y no en la raíz: el plugin de Micronaut, si encuentra un
      # Dockerfile en la raíz del proyecto, cambia el tipo de su tarea
      # `dockerfile` y rompe la configuración de build.gradle.kts.
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    # Sin depends_on de db: la base es RDS, que vive fuera de este compose.
    environment:
      # Qué ambiente es este servidor. Carga application-<APP_ENV>.properties
      # además del base. Va aquí y no en el Dockerfile a propósito: así la
      # imagen es UNA sola y la misma que se probó en staging es la que sube a
      # producción, cambiando solo cómo se arranca.
      MICRONAUT_ENVIRONMENTS: ${APP_ENV:-dev}
      # La URL la arma el perfil (APP_ENV) con estos datos y su propio
      # esquema: dev → stackline_dev, prod → stackline_prod.
      # DB_HOST apunta a RDS. Para volver al contenedor: DB_HOST=db y
      # levantar con --profile local-db.
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-erp_maya}
      DB_USER: ${DB_USER:-erp_maya}
      DB_PASSWORD: ${DB_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en .env}
      # Crea la empresa y el primer usuario en el arranque inicial, y no hace
      # nada si la empresa ya existe. Dejarlo encendido es inofensivo; lo que
      # NO puede quedarse es la contraseña por defecto, de ahí el :? .
      ERP_SEED_ENABLED: "${SEED_ENABLED:-true}"
      ERP_SEED_COMPANY_CODE: ${SEED_COMPANY_CODE:?define SEED_COMPANY_CODE en .env}
      ERP_SEED_COMPANY_NAME: ${SEED_COMPANY_NAME:-Stackline}
      ERP_SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?define SEED_ADMIN_EMAIL en .env}
      ERP_SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?define SEED_ADMIN_PASSWORD en .env}
      # Asistente comercial: el ERP le reenvía /api/agent/turn y le entrega
      # los avisos de cotización. Misma llave que espera agents-services.
      AGENT_URL: http://agents:8081
      AGENT_KEY_ERP: ${AGENT_KEY_ERP:?define AGENT_KEY_ERP en .env}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=70}
    # Tampoco se expone: solo Caddy le habla, por la red interna.

  # Tino, el agente de ventas (agents-services). Usa la misma base que el ERP
  # pero en su propio esquema, según el perfil: agents_dev o agents_prod.
  # El esquema se crea UNA vez a mano antes del primer arranque (ver README).
  agents:
    build:
      context: ${AGENTS_CONTEXT:-../../agents-services}
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on: [backend]
    # Tope de memoria: comparte máquina con el ERP. La JVM toma su porcentaje
    # de este límite, no de la RAM total del servidor.
    mem_limit: ${AGENTS_MEM_LIMIT:-768m}
    environment:
      MICRONAUT_ENVIRONMENTS: ${APP_ENV:-dev}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-erp_maya}
      DB_USER: ${DB_USER:-erp_maya}
      DB_PASSWORD: ${DB_PASSWORD:?}
      ERP_BASE_URL: http://backend:8080
      # Doble uso: el ERP la manda al llamar al agente, y el agente la manda
      # para pedir al ERP un token por empresa (/api/internal/service-token).
      AGENT_KEY_ERP: ${AGENT_KEY_ERP:?}
      # Llave del modelo. La base guarda solo el NOMBRE de la variable
      # (ai_provider.credential_ref); el valor llega por aquí.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # WhatsApp Cloud API. Sin app-secret el webhook se rechaza entero.
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_STICKERS_ENABLED: ${WHATSAPP_STICKERS_ENABLED:-true}
      JAVA_OPTS: ${AGENTS_JAVA_OPTS:--XX:MaxRAMPercentage=75}
    # No publica puertos: el backend le habla por la red interna y Caddy solo
    # le reenvía /webhooks/whatsapp (lo único que Meta necesita ver).

  web:
    build:
      # El repo se llama stack-line-ui, pero en la máquina de desarrollo la
      # carpeta es maya-ui. UI_CONTEXT lo resuelve sin editar este archivo.
      context: ${UI_CONTEXT:-../../stack-line-ui}
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on: [backend]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      API_UPSTREAM: backend:8080
      AGENT_UPSTREAM: agents:8081
    ports:
      - "80:80"
      - "443:443"

    volumes:
      - caddydata:/data      # certificados: sin esto se re-emiten en cada
      - caddyconfig:/config  # reinicio y Let's Encrypt tiene límite semanal

volumes:
  pgdata:
  caddydata:
  caddyconfig:
